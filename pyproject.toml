[project]
name = "examcard"
version = "0.1.0"
description = "考试知识图解卡片生成引擎（V2 内核，自 yijian2 抽包；materials→evidence→knowledge→compilers→gates 流水线）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "examcard maintainers" }]

# 下限与 yijian2 requirements.txt 保持一致，上限由 uv.lock 固定。
# 升级依赖：`uv add openai@latest`；同步本地：`uv sync`。
dependencies = [
    "PyMuPDF>=1.24.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "pydantic>=2.7.0",
    # utils/table_render 确定性表格渲染分支依赖（缺失时 step3/step4 优雅回退 AI 生图）
    "matplotlib>=3.8.0",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python>=4.10.0,<5",
    "numpy>=1.23.0",
]

# 与 yijian2 的差异：pytest 从运行时依赖移入 dev 组（uv sync 默认安装）。
# ruff / mypy / pytest-cov / types-pyyaml 固定精确版本：它们产出的是「判定」（lint
# 结论、类型结论、覆盖率数字；存根版本同样改变类型结论），换一档版本结论就变，
# 不允许随各人机器上的全局安装漂移。
[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest>=8.0.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
    "types-pyyaml==6.0.12.20260815",
]

# 与 yijian2 的差异：本仓是可安装包（src 布局），不再 package = false。
[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# 测试隔离规范见 docs/engineering_skeleton.md 第 4 节（T1–T8）。
testpaths = ["tests"]
addopts = '--strict-markers -m "not live"'
markers = [
    "live: 真实外部调用（LLM/生图/外网）。默认剔除，显式 `uv run pytest -m live` 运行。",
    "slow: 本地慢用例（单条 >30s）。默认执行，可用 -m \"not slow\" 剔除。",
]

# 覆盖率不进 addopts：默认跑（27s 全绿）要保持快，覆盖率是显式动作
# `uv run pytest --cov`。CI 单跑一次带 --cov，见 .github/workflows/ci.yml。
[tool.coverage.run]
# 用 source_pkgs 而非 source=["src/examcard"]：按「包名」度量，editable 装与
# site-packages 装都能对上号。写死源码路径的话，一旦 CI 上装成非 editable，
# 导入解析到 site-packages、路径匹配不上，覆盖率会假报成 0%。
source_pkgs = ["examcard"]
# 分支覆盖：本仓大量 gates 判定是 if/else 决策，行覆盖会高估保障强度。
branch = true
# 跨平台路径可比：CI 是 windows + ubuntu 双跑，绝对路径会让两边报告无法对账。
relative_files = true

[tool.coverage.report]
precision = 1
show_missing = true
exclude_also = [
    # 仅类型检查期存在的分支，运行时永不执行。
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# 显式钉死目标版本，不依赖从 requires-python 推断：PEP 701 嵌套 f-string
# （compilers/step3_card.py）只在 3.12 合法，推断错一档整个文件就退化成 E999
# 语法错误、静默脱离 lint 覆盖。
target-version = "py312"
src = ["src", "tests", "migration"]

# 规则集暂用 ruff 默认（E4/E7/E9 + F）：先把现有真信号清零并接进 CI，
# 再逐条加规则，避免一次性引入几千条噪声反而没人看。
[tool.ruff.lint.per-file-ignores]
# 门面模块（re-export 聚合层）：转出即用途，未被本文件引用不是缺陷。
"src/examcard/**/__init__.py" = ["F401"]
# 测试里 `ROOT = Path(__file__)...` 夹在两组 import 之间（早年 sys.path 引导的
# 遗留位置，如今包已按 src 布局正常安装），于是它后面每行 import 都被判成
# 「不在文件头」。纯排版、零运行时影响；真正的清理是把该常量移到 import 之后。
"tests/**" = ["E402"]

# ---------------------------------------------------------------------------
# 类型检查：全仓不一次性开严，只把「判定层」钉死。
#
# gates/ 与 compilers/ 是出结论的地方（门禁裁决、契约编译），一处 None 漏检就
# 可能让本该 fail-closed 的用例静默放行；这两包按严格档校验。其余包先保持宽松
# 基线（只查明显错误），等这两包稳住再逐包上收。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/examcard"]
# pydantic v2 是本仓的骨干（近百处 BaseModel/StrictModel）。不挂官方插件，
# mypy 读不懂 Field()/model_validator 生成的 __init__ 与字段描述符，会刷出
# 成百条假 attr-defined / arg-type，把真信号埋掉。
plugins = ["pydantic.mypy"]
# 宽松基线：不强制补注解，只抓真实类型冲突。
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["examcard.gates.*", "examcard.compilers.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

# 无类型存根的三方库：PyMuPDF / OpenCV / RapidOCR 均不发 stub，
# 这里只关「找不到存根」，不放过我们自己代码里的类型冲突。
[[tool.mypy.overrides]]
module = ["fitz.*", "cv2.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# 逐模块豁免清单（棘轮）：只许缩短，不许加宽。
#
# 作用是让「全仓 mypy」这一步能在 CI 里退出 0，同时保住两条硬线：
#   1) gates/ 与 compilers/ 走上面的严格档，一个模块都不许出现在本清单里；
#   2) 每条豁免只关掉该模块此刻实测在报的那几个错误码——新错误码、新模块、
#      严格档里的任何回归，都会照常把 CI 打红。
#
# 已知盲区：已豁免模块内、已豁免错误码下新增的同类错误拦不住。缩小盲区的办法是把
# 下面的条目逐条删掉（即改掉真问题），而不是把码集合往大里写。
#
# 基线实测（mypy 2.3.1 + pydantic 插件，--no-incremental，checked 127 source files）：
# 首测 263 条 / 35 个模块。已按「正解」真修掉并从本清单删除条目的：
# v25_generic_contracts 58 条、learning_fixture 28 条。现测 177 条 / 33 个模块，
# 按码分布：assignment 71、attr-defined 51、arg-type 22、call-arg 12、union-attr 6、
# prop-decorator 4、var-annotated 4、misc 2、call-overload 2、index 2、
# import-not-found 1（operator、return-value 两族已随上述修复清零）。
# 每个模块后面括号里的数字是它当时的条数，删条目时拿它对账。
#
# 成因逐族抽样核查过，没有一条是「访问模型上根本不存在的字段」那类真缺陷——那一类
# 上一轮已作为 DiagramEdgeRef 缺陷单独修掉并加了封印测试。反复出现的四种形状：
#   A. 循环变量复用：同一个名字在同文件多个 for 里迭代不同的模型类型，mypy 认死第一
#      次绑定的类型，后面每个本来合法的字段访问都记一条 attr-defined。占 attr-defined
#      的主体。正解是逐个循环改名。
#   B. 首次赋值定死类型：`x = ("a",)` 推成定长 tuple[str]，后续再赋 tuple[str, ...]
#      就冲突。占 assignment 的主体，正解是补一行显式注解。
#   C. 中间字典声明成 dict[str, object]：`**payload` 解包进强类型形参会逐个形参报
#      arg-type，取下标再赋值报 index，原样返回报 return-value。正解是换 TypedDict。
#   D. 相关条件：非空性由另一个布尔量或枚举取值担保，mypy 不跨条件收窄，报 union-attr。
# ---------------------------------------------------------------------------

# 形状 B。另含 pydantic 子类收窄父类 Literal[...] 判别字段的一族：
# admission_fixtures 那 5 条全是 TypedTextBase 的子类把 schema_version 收窄成自己的
# 字面量，mypy 按不变量看待类属性覆盖，pydantic 却把它当判别式惯用法。
[[tool.mypy.overrides]]
module = [
    "examcard.evidence.fusion",                               # 3
    "examcard.knowledge.contracts.admission_fixtures",        # 5
    "examcard.knowledge.contracts.audits",                    # 13
    "examcard.knowledge.contracts.echo_release",              # 2
    "examcard.knowledge.contracts.obligations",               # 1
    "examcard.knowledge.contracts.phase2r142_v25_projection", # 1
    "examcard.knowledge.projection",                          # 2
    "examcard.pipeline.run",                                  # 2
    "examcard.pipeline.shadow",                               # 1
    "examcard.providers.base",                                # 3
    "examcard.providers.envelope_profiles",                   # 6
]
disable_error_code = ["assignment"]

# 形状 C：`**payload` 解包进强类型形参。payload 声明成 dict[str, object]，mypy 无法
# 按键分辨 str/int，于是每个形参各报一条（derivation:745 一行就 3 条）。
# derivation:144 另有一条 isinstance(x, ModelMetaclass | None)——可选的模型类对象
# 直接进 isinstance，值得单独收拾。正解是把中间字典换成 TypedDict 或改传具名参数。
[[tool.mypy.overrides]]
module = [
    "examcard.evidence.layout",                 # 1
    "examcard.evidence.native",                 # 2
    "examcard.knowledge.contracts.derivation",  # 10
]
disable_error_code = ["arg-type"]

# call-arg 全部落在 `Model.model_construct(...)` 上：pydantic 的 mypy 插件给
# model_construct 合成了「必须给齐全部字段」的签名，而它的真实契约是部分赋值 + 跳过
# 校验（本仓拿它做 hash 前的骨架构造）。这是插件的假阳性，不是漏参。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.admission_legacy_hash"] # 2
disable_error_code = ["call-arg"]

# 10 条 call-arg 同上（model_construct）；1 条 arg-type 是 Path | None 传进要 Path 的
# 形参（step2a_builders:291），属形状 D 的近亲，可以单独修掉。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.step2a_builders"] # 11
disable_error_code = ["arg-type", "call-arg"]

# 形状 C（arg-type）+ 空容器缺注解（var-annotated），phase2r13 另有 1 条形状 A。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.phase2r12_v25_golden_review"] # 4
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.phase2r13_v25_reconciliation"] # 5
disable_error_code = ["arg-type", "attr-defined", "var-annotated"]

# 形状 C 的下标变体：report 声明成 dict[str, object]，`report["probes"]["step2a"] = …`
# 里内层拿到的是 object，报 index。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.phase2r14_v25_live"] # 3
disable_error_code = ["attr-defined", "index"]

# 形状 D（相关条件）。fact_engine:760/787/808：released_visual 是
# `disposition_entry is not None and is_released_disposition(...)`，之后拿这个布尔量
# 当守卫，mypy 不会把布尔的真值回传成 disposition_entry 的非空收窄——运行时不可能为
# None。正解是先算出「非空且已放行」的 entry 本身再判，收窄就能传下去。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.fact_engine"] # 6
disable_error_code = ["arg-type", "assignment", "union-attr"]

# 同形状 D。request_helpers:174/175 是
# `table.row_count if obligation.kind == COMPLETE_TABLE_COMPOSITION else None`：
# table 的非空性与 kind 的取值绑定，mypy 不关联这两个条件。
[[tool.mypy.overrides]]
module = [
    "examcard.knowledge.contracts.request_helpers", # 2
    "examcard.knowledge.planner.bridge",            # 1
]
disable_error_code = ["union-attr"]

# call-overload 2 条是 OpenAI SDK 的
# chat.completions.with_raw_response.create(...)：本仓按 dict 动态拼 response_format /
# stream 等 kwargs，mypy 挑不到匹配的重载分支。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.llm"] # 7
disable_error_code = ["assignment", "call-overload"]

# mypy 不支持 @property 之上再叠装饰器，而本仓用的正是 pydantic 的
# `@computed_field` + `@property` 标准写法。这是 mypy 的已知限制，代码没有问题。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.quality"] # 3
disable_error_code = ["attr-defined", "prop-decorator"]

[[tool.mypy.overrides]]
module = ["examcard.knowledge.schema"] # 2
disable_error_code = ["prop-decorator"]

# misc 1 条是 live_run:732 `stage_executor(...)`——可选回调在调用点没收窄，报
# "None" not callable。这条其实是形状 D，修起来只要一句显式判空。
[[tool.mypy.overrides]]
module = ["examcard.pipeline.live_run"] # 7
disable_error_code = ["arg-type", "assignment", "misc"]

# 这条不是类型噪声，是给一处真缺陷记账：build_phase2r11_five_golden_report 内部
# `from tools.verify_phase2r1_phase2r0_freeze import ...`，而本仓没有 tools/ 包（旧仓
# 遗留路径，yijian2 对应路径也不在），该函数一旦被调用就 ModuleNotFoundError。
# 目前 src/tests/migration 里零调用点（只有 docs/prework 的历史 import 扫描提到它），
# 所以先记账不修。修法二选一：把那个工具移植进来，或删掉这个死函数。
[[tool.mypy.overrides]]
module = ["examcard.knowledge.contracts.phase2r11_generic_five_golden"] # 1
disable_error_code = ["import-not-found"]
