[project]
name = "examcard"
version = "0.1.0"
description = "考试知识图解卡片生成引擎（V2 内核，自 yijian2 抽包；materials→evidence→knowledge→compilers→gates 流水线）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "examcard maintainers" }]

# 下限与 yijian2 requirements.txt 保持一致，上限由 uv.lock 固定。
# 升级依赖：`uv add openai@latest`；同步本地：`uv sync`。
#
# 已删三项「零 import 声明」（原 12 项 → 现 9 项）：
#   - flask：webui 是纯函数静态 HTML 渲染器，tests/test_webui_review_workbench.py
#     里的 test_workbench_module_never_imports_flask_or_gates_upward 反而 AST 断言
#     禁止 import flask（勘察实录 docs/prework/P3_webui勘察_20260812.md）。
#   - matplotlib：utils/table_render 确定性表格渲染分支尚未落地，全仓零 import。
#     conftest 的 T7 `MPLBACKEND=Agg` 留着不动——它是 setdefault，无依赖时是空守卫。
#   - python-dotenv：T6 规定测试不自动加载 .env，live 密钥一律显式读环境变量。
# 将来真要落 flask 路由或 table_render 渲染分支，再 `uv add` 加回并同步本文档口径。
dependencies = [
    "PyMuPDF>=1.24.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.7.0",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python>=4.10.0,<5",
    "numpy>=1.23.0",
]

# 与 yijian2 的差异：pytest 从运行时依赖移入 dev 组（uv sync 默认安装）。
# ruff / mypy / pytest-cov / types-pyyaml 固定精确版本：它们产出的是「判定」（lint
# 结论、类型结论、覆盖率数字；存根版本同样改变类型结论），换一档版本结论就变，
# 不允许随各人机器上的全局安装漂移。
[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest>=8.0.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
    "types-pyyaml==6.0.12.20260815",
]

# 与 yijian2 的差异：本仓是可安装包（src 布局），不再 package = false。
[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# 测试隔离规范见 docs/engineering_skeleton.md 第 4 节（T1–T8）。
testpaths = ["tests"]
addopts = '--strict-markers -m "not live"'
markers = [
    "live: 真实外部调用（LLM/生图/外网）。默认剔除，显式 `uv run pytest -m live` 运行。",
    "slow: 本地慢用例（单条 >30s）。默认执行，可用 -m \"not slow\" 剔除。",
]

# 覆盖率不进 addopts：默认跑（27s 全绿）要保持快，覆盖率是显式动作
# `uv run pytest --cov`。CI 单跑一次带 --cov，见 .github/workflows/ci.yml。
[tool.coverage.run]
# 用 source_pkgs 而非 source=["src/examcard"]：按「包名」度量，editable 装与
# site-packages 装都能对上号。写死源码路径的话，一旦 CI 上装成非 editable，
# 导入解析到 site-packages、路径匹配不上，覆盖率会假报成 0%。
source_pkgs = ["examcard"]
# 分支覆盖：本仓大量 gates 判定是 if/else 决策，行覆盖会高估保障强度。
branch = true
# 跨平台路径可比：CI 是 windows + ubuntu 双跑，绝对路径会让两边报告无法对账。
relative_files = true

[tool.coverage.report]
precision = 1
show_missing = true
exclude_also = [
    # 仅类型检查期存在的分支，运行时永不执行。
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# 显式钉死目标版本，不依赖从 requires-python 推断：PEP 701 嵌套 f-string
# （compilers/step3_card.py）只在 3.12 合法，推断错一档整个文件就退化成 E999
# 语法错误、静默脱离 lint 覆盖。
target-version = "py312"
src = ["src", "tests", "migration"]

# 规则集暂用 ruff 默认（E4/E7/E9 + F）：先把现有真信号清零并接进 CI，
# 再逐条加规则，避免一次性引入几千条噪声反而没人看。
[tool.ruff.lint.per-file-ignores]
# 门面模块（re-export 聚合层）：转出即用途，未被本文件引用不是缺陷。
"src/examcard/**/__init__.py" = ["F401"]
# 测试里 `ROOT = Path(__file__)...` 夹在两组 import 之间（早年 sys.path 引导的
# 遗留位置，如今包已按 src 布局正常安装），于是它后面每行 import 都被判成
# 「不在文件头」。纯排版、零运行时影响；真正的清理是把该常量移到 import 之后。
"tests/**" = ["E402"]

# ---------------------------------------------------------------------------
# 类型检查：全仓不一次性开严，只把「判定层」钉死。
#
# gates/ 与 compilers/ 是出结论的地方（门禁裁决、契约编译），一处 None 漏检就
# 可能让本该 fail-closed 的用例静默放行；这两包按严格档校验。其余包先保持宽松
# 基线（只查明显错误），等这两包稳住再逐包上收。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/examcard"]
# pydantic v2 是本仓的骨干（近百处 BaseModel/StrictModel）。不挂官方插件，
# mypy 读不懂 Field()/model_validator 生成的 __init__ 与字段描述符，会刷出
# 成百条假 attr-defined / arg-type，把真信号埋掉。
plugins = ["pydantic.mypy"]
# 宽松基线：不强制补注解，只抓真实类型冲突。
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
# 逐点 `# type: ignore[码]` 是本仓唯一的关码手段（模块级豁免清单 cm29 已清零），
# 所以这条必须全局开：某处 ignore 一旦因上游修好而失效，mypy 立刻报 unused-ignore，
# 逼着同一批把它删掉，而不是让过期注释永久留在代码里当噪声。
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["examcard.gates.*", "examcard.compilers.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
extra_checks = true

# 无类型存根的三方库：PyMuPDF / OpenCV / RapidOCR 均不发 stub，
# 这里只关「找不到存根」，不放过我们自己代码里的类型冲突。
[[tool.mypy.overrides]]
module = ["fitz.*", "cv2.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# 逐模块豁免清单（棘轮）：cm29 已清零——本文件不再有任何 disable_error_code。
#
# 历史：首测 263 条 / 35 个模块。按「正解真修」逐批退条目（第 1~8 批退掉 29 个模块，
# cm23 退 knowledge.llm），到 cm28 只剩 6 个模块 / 18 条：call-arg 12、
# prop-decorator 4、arg-type 1、import-not-found 1。cm29 把这 18 条收口：
#
#   - admission_legacy_hash 那 2 条 call-arg **是真错，不是插件假阳性**（旧注释误诊成
#     model_construct）：`field.default_factory()` 对 pydantic v2 的
#     `Callable[[], Any] | Callable[[dict[str, Any]], Any] | None` 少传参，来一个单参
#     factory 就会在运行时 TypeError。已按正解改用 `FieldInfo.get_default(...)`；
#     等值实测：全仓 500 个模型 / 1428 个默认值字段两种写法逐个相等且同型，
#     canonical 载荷与旧口径哈希均不变。
#   - 其余 16 条是工具侧限制，改成**行尾逐点 `# type: ignore[码]`**，原因写在出错点旁边：
#     step2a_builders:438 一行 10 条（pydantic 插件给 model_construct 合成「必须列全字段」
#     的签名，而它的真实契约是部分赋值 + 跳过校验）、knowledge/schema 与 knowledge/quality
#     各 2 条（mypy 不支持 @property 之上再叠装饰器，python/mypy#1362，而
#     `@computed_field` + `@property` 正是 pydantic 官方写法）、
#     phase2r11:507 1 条（tools/ 未随内核迁移，给缺陷记账，且有测试封住「调用即炸」）。
#     其中 derivation 那 1 条「盖子」已在 cm30 按正解拆掉（版本表提到模块级 Final、
#     6 个版本相关字段各自就地 isinstance 窄化），逐点 ignore 因此从 20 条 / 11 个文件
#     降到 19 条 / 10 个文件，proposal 全程保持 12 元 union 受检。
#
# 为什么逐点关码严于模块级豁免：盲区从「整个模块内该错误码的全部错误」缩到「这一行」。
# 例如 step2a_builders 有数百行，原先整模块的 call-arg 全部失明，现在只有 model_construct
# 那一行失明。
# 再配上全局 warn_unused_ignores，某条 ignore 一旦因上游修好而失效，mypy 会当场点名。
#
# 棘轮的下一档由 tests/test_mypy_waiver_ratchet.py 执行：
#   1) 任何 disable_error_code / ignore_errors 条目都不许再出现；
#   2) 逐点 ignore 清单（文件 × 错误码 × 条数）钉在封印里，只许缩短，新增即失败；
#   3) gates/ 与 compilers/ 永远走严格档，且永不出现在任何关码条目里；
#   4) 全局 warn_unused_ignores 必须保持开启。
# ---------------------------------------------------------------------------
