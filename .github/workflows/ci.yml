name: CI

# 本仓是"字节权威"仓库：金标/夹具/canonical 哈希锚定工作区字节，.gitattributes
# 全路径 -text 禁止任何行尾转换。因此 CI 的价值不只是跑测试，而是把这份纪律从
# "靠人记得手跑 pytest"变成机器强制。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + types + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个 OS 互不熔断：跨平台字节一致性正是 -text 要保证的东西，出问题要看得见。
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # evidence/visual.py 顶层 import cv2（opencv-python 非 headless 版），
      # Linux 上需要 libGL 才能加载。
      - name: 安装 OpenCV 运行库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 安装 uv（版本固定）
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
          enable-cache: true

      # --locked：pyproject 与 uv.lock 不一致就直接失败，禁止隐式改锁。
      # Python 版本由 .python-version（3.12）决定，uv 自行取用。
      - name: 按锁文件安装依赖
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check src tests migration

      # mypy 正式入门禁。一次跑覆盖两档，靠 pyproject [tool.mypy] 的逐模块配置分流：
      #   - gates/ 与 compilers/ 走严格档（disallow_untyped_defs 等一整套），实测清零；
      #   - 其余包走宽松基线 + 一份「逐模块 × 错误码」的豁免清单，把 263 条既有噪声精确
      #     挂账，而不是 ignore_errors 一刀切。清单只许缩短，条目旁记着当时的条数。
      # 有牙是实测过的：临时往 gates/ 放一个未注解函数，会被 no-untyped-def 拦下；往只
      # 豁免了 assignment 的模块里塞一处 attr-defined，同样报错。即新错误码、新模块、
      # 严格档回归都会把这一步打红。盲区（已豁免模块内已豁免码下的新增同类错误）写在
      # pyproject 的清单头部。
      # 配置里已固定 files = ["src/examcard"]，所以这里不需要再传路径。
      - name: mypy（gates+compilers 严格档，其余走豁免清单棘轮）
        run: uv run mypy

      # -rs 打印跳过原因：旧仓金标语料不在 CI 上，92 个回放用例会整体跳过，
      # conftest 会在摘要里响亮报数。若哪天 CI 能拿到语料，设
      # EXAMCARD_LEGACY_ROOT 指向 yijian2，并置 EXAMCARD_REQUIRE_LEGACY_CORPUS=1
      # 把"语料缺席"从跳过升级为收集期失败。
      #
      # --cov-fail-under=75：基线实测 75.5%（分支覆盖，21017 条语句漏 4018；
      # 714 passed / 9 skipped，带覆盖率本机跑 60~95s，随机器负载浮动）。门槛只许往上
      # 棘轮，不许往下调；掉下去说明新代码没带测试。当前余量只有 0.5pp。
      # 覆盖率配置见 pyproject [tool.coverage.*]。
      #
      # --basetemp 收进仓内 .test-tmp/（规范 T3）：与本地跑法逐字一致，产物位置可预期、
      # 失败时可直接当 artifact 上传，也绕开某些机器上系统 TEMP 不可写的坑。
      - name: pytest（带覆盖率门槛）
        run: uv run pytest -q -rs --cov --cov-report=term-missing --cov-fail-under=75 --basetemp .test-tmp/ci