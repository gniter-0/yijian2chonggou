name: CI

# 本仓是"字节权威"仓库：金标/夹具/canonical 哈希锚定工作区字节，.gitattributes
# 全路径 -text 禁止任何行尾转换。因此 CI 的价值不只是跑测试，而是把这份纪律从
# "靠人记得手跑 pytest"变成机器强制。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + types + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个 OS 互不熔断：跨平台字节一致性正是 -text 要保证的东西，出问题要看得见。
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # evidence/visual.py 顶层 import cv2（opencv-python 非 headless 版），
      # Linux 上需要 libGL 才能加载。
      - name: 安装 OpenCV 运行库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 安装 uv（版本固定）
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
          enable-cache: true

      # --locked：pyproject 与 uv.lock 不一致就直接失败，禁止隐式改锁。
      # Python 版本由 .python-version（3.12）决定，uv 自行取用。
      - name: 按锁文件安装依赖
        run: uv sync --locked

      # 扫描面与 pyproject 的 [tool.ruff] src 逐字对齐（cm33 起含 tools/）：新顶层代码目录
      # 漏收编就等于它一诞生就在 lint 之外，这条一致性由
      # tests/test_repo_discipline_seal.py 钉成机器判定，不靠下一个人恰好想起来。
      - name: ruff
        run: uv run ruff check src tests migration tools

      # mypy 正式入门禁。一次跑覆盖两档，靠 pyproject [tool.mypy] 的逐模块配置分流：
      #   - gates/ 与 compilers/ 走严格档（disallow_untyped_defs 等一整套），实测清零；
      #   - 其余包走宽松基线，且 cm29 起**没有任何模块级豁免**：原先那份「逐模块 × 错误码」
      #     的清单（首测 263 条，逐批真修到 18 条）已清零——2 条是真错按正解修掉，
      #     剩下 16 条工具/上游限制改成出错行上的 `# type: ignore[码]`，盲区从整个模块
      #     缩到那一行，且每处旁边都写着为什么。
      # 配套开了全局 warn_unused_ignores：某处逐点 ignore 一旦因上游修好而失效，这一步
      # 会当场报 unused-ignore，逼着同批删掉，而不是让过期注释永久留着当噪声。
      # 有牙是实测过的：临时往 gates/ 放一个未注解函数，会被 no-untyped-def 拦下；
      # 删掉任一处逐点 ignore 或把 admission 的 get_default 改回零参 default_factory()，
      # 这一步立刻打红。「只许缩短」由 tests/test_mypy_waiver_ratchet.py 把关：零模块级
      # 豁免、逐点 ignore 清单（文件 × 错误码 × 条数）钉死、禁裸 ignore、严格档禁豁免。
      # 配置里已固定 files = ["src/examcard"]，所以这里不需要再传路径。
      - name: mypy（gates+compilers 严格档，其余零模块级豁免）
        run: uv run mypy

      # -rs 打印跳过原因：旧仓金标语料不在 CI 上，32 条回放用例会被 8 处语料闸门挡掉
      # （那 5 个模块共 92 条，其余 60 条不依赖语料、照常跑——别把这里读成"92 条整体
      # 蒸发"，cm32 实测过），conftest 会按跳过报告现算条数并在摘要里响亮报出。cm32 同批
      # 把 3 处绕过记账的裸 skipif 收归 requires_legacy_corpus：裸的既不进记账（摘要曾少报
      # 11 条），也不受下面那个严格模式管辖；这条不变式由
      # tests/test_corpus_gate_accounting_seal.py 看住。若哪天 CI 能拿到语料，设
      # EXAMCARD_LEGACY_ROOT 指向 yijian2，并置
      # EXAMCARD_REQUIRE_LEGACY_CORPUS=1 把"语料缺席"从跳过升级为收集期失败。
      #
      # --cov-fail-under=75：cm32 实测两档（分支覆盖，21,452 条语句）——语料缺席
      # `795 passed / 41 skipped`、漏 4,044、75.75%（余量 0.75pp，CI 就是这一档）；
      # 语料在位跑严格模式 `827 passed / 9 skipped`、漏 4,023、75.88%（余量 0.88pp）。
      # 两档过+跳合计都是 836：闸门只改"过/跳"归属，不改总数。
      # 带覆盖率本机跑 70~105s，随机器负载浮动。门槛只许往上棘轮，不许往下调；掉下去
      # 说明新代码没带测试。覆盖率配置见 pyproject [tool.coverage.*]。
      #
      # --basetemp 收进仓内 .test-tmp/（规范 T3，强制条款见 docs/engineering_skeleton.md §4.1）：
      # 与本地跑法逐字一致，产物位置可预期、失败时可直接当 artifact 上传，也绕开某些机器上
      # 系统 TEMP 不可写的坑（本机 %TEMP%\pytest-of-* 已 ACL 损伤，裸跑上百条 ERROR）。
      #
      # cm33 起这一步还顺带执行「字节权威」：tests/test_repo_discipline_seal.py 按 HEAD 字节
      # 断言全树跟踪文件零 BOM、每个文件行尾自洽（既存混杂按清单逐条钉住、只许缩短）。
      # 在此之前这条纪律唯一的执行手段是一个 gitignore 掉的脚本 + 人记得手跑，工作台一删就没牙。
      # 工作区那一档仍由 tools/eolaudit.py 负责（改完文件跑一次，要求 VIOLATIONS=0）。
      - name: pytest（带覆盖率门槛）
        run: uv run pytest -q -rs --cov --cov-report=term-missing --cov-fail-under=75 --basetemp .test-tmp/ci